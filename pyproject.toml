[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exploit-path-traversal"
version = "0.1.0"
description = "AI-assisted autonomous path traversal discovery and verification toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Deadmafiya" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# OpenAPI/Swagger specs are often YAML. JSON specs work with no extra deps.
yaml = ["PyYAML>=6.0"]

[project.scripts]
exploit-path-traversal = "exploit_path_traversal.cli:main"

[tool.setuptools.packages.find]
include = ["exploit_path_traversal*"]
